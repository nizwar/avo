<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{v:title}}</title>
<meta name="description" content="{{v:description}}">
<meta http-equiv="Content-Security-Policy" content="{{v:csp}}">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a1108">
<link rel="canonical" href="{{v:canonical}}">
<link rel="alternate" hreflang="en" href="{{v:altEn}}">
<link rel="alternate" hreflang="id" href="{{v:altId}}">
<link rel="alternate" hreflang="x-default" href="{{v:altEn}}">
<link rel="icon" href="{{v:root}}assets/img/avo-favicon.svg" type="image/svg+xml">
<link rel="icon" href="{{v:root}}assets/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="{{v:root}}assets/img/favicon-180.png">
<link rel="manifest" href="{{v:root}}site.webmanifest">
{{h:fontPreloads}}
<link rel="stylesheet" href="{{v:root}}assets/css/site.css?v={{v:cssVersion}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Avo">
<meta property="og:title" content="{{v:title}}">
<meta property="og:description" content="{{v:description}}">
<meta property="og:url" content="{{v:canonical}}">
<meta property="og:image" content="{{v:ogImage}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{v:ogAlt}}">
<meta property="og:locale" content="{{v:ogLocale}}">
<meta property="og:locale:alternate" content="{{v:ogLocaleAlt}}">
<meta name="twitter:card" content="summary_large_image">
<script type="application/ld+json">{{h:jsonLd}}</script>
