<!doctype html>
<html lang="{{v:lang}}">
<head>
{{> head}}
</head>
<body class="page page-404">
{{> sprite}}
{{> header}}
<main id="main" class="not-found">
  <div class="wrap not-found-grid">
    <h1 class="h-display">{{t:notFound.title}}</h1>
    <div class="not-found-copy">
      <p class="lead">{{t:notFound.text}}</p>
      <p class="link-row">
        <a class="btn btn-primary" href="{{v:homeHref}}">{{t:notFound.home}}<svg class="icon" aria-hidden="true" focusable="false"><use href="#i-arrow"/></svg></a>
        <a class="text-link" href="{{v:hubHref}}">{{t:nav.hub}}</a>
      </p>
      <p class="muted" lang="{{v:otherLang}}">{{v:otherNotFound}} <a href="{{v:otherHomeHref}}">{{v:otherHomeLabel}}</a></p>
    </div>
  </div>
</main>
{{> footer}}
<script type="module" src="{{v:root}}assets/js/site.js?v={{v:jsVersion}}"></script>
</body>
</html>
