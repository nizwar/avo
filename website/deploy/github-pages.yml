# GitHub Pages deployment for the Avo website.
#
# To use it, copy this file to .github/workflows/website.yml in the repository
# (it is kept here so the website folder is self-contained), then in the
# repository's Settings > Pages choose "GitHub Actions" as the source.
#
# It refuses to deploy while website/site.config.mjs still has placeholders.

name: Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so the sitemap dates each page by its last change.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: npm test
      - name: Build (fails while placeholders remain)
        run: npm run build:strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
