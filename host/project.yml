# XcodeGen spec for the macOS host. Generate the project with:
#
#   cd host && xcodegen generate
#
# Product layout (spec: "Komponen host macOS"):
#
#   Avo.app                                   Control Panel (SwiftUI)
#     Contents/MacOS/Avo
#     Contents/Library/Helpers/AvoDaemon.app  Runtime Daemon (LaunchAgent) + Menu Bar Item
#     Contents/Library/LaunchAgents/dev.avo.daemon.plist
#     Contents/Library/Shim/AvoShim.app       App Shim template, copied per Android app
#     Contents/Frameworks/AvoWindowHost.framework   Window Host, loaded by every shim
#     Contents/Resources/profiles/            device and keymap profiles
#     Contents/Resources/gfxstream/           GPU renderer for avo-vmm (scripts/build-gfxstream.sh)
#     Contents/Resources/bluetooth/           Bluetooth controller for avo-vmm (scripts/build-bluetooth.sh)
#     Contents/MacOS/avo-vmm                  Engine VM (engine/hvf/vmm, Rust)

name: Avo
options:
  bundleIdPrefix: dev.avo
  developmentLanguage: en
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER_PREFIX: $(AVO_BUNDLE_ID_PREFIX)

packages:
  AvoKit:
    path: AvoKit
  # Avo's own updates (Avo/AppUpdater.swift, docs/releasing.md): EdDSA-signed
  # archives from the appcast at SUFeedURL. Its tools (generate_keys,
  # sign_update, generate_appcast) land in the derived data's
  # SourcePackages/artifacts/sparkle/Sparkle/bin.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0

targets:
  Avo:
    type: application
    platform: macOS
    sources:
      - path: Avo
        excludes:
          - "LaunchAgents/**"
      - path: Avo/LaunchAgents
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
      - path: ../profiles
        type: folder
        buildPhase: resources
    dependencies:
      - package: AvoKit
        product: AvoHostKit
        embed: true
        codeSign: true
      # Only the Control Panel updates Avo; the daemon restarts on the new
      # build by itself (AvoDaemon/AppUpdateWatcher.swift). Xcode embeds and
      # signs the binary framework by itself (embed: true would copy a
      # "Sparkle-product" that does not exist).
      - package: Sparkle
        embed: false
      - target: AvoDaemon
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/Helpers
      - target: AvoWindowHost
        embed: true
        codeSign: true
      - target: AvoShim
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/Shim
      - target: avoctl
        embed: true
        codeSign: true
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AVO_APP_BUNDLE_ID)
        PRODUCT_NAME: Avo
        INFOPLIST_FILE: Avo/Info.plist
        CODE_SIGN_ENTITLEMENTS: Avo/Avo.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AvoSkin
        ENABLE_PREVIEWS: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        # The avo-vmm phase runs cargo on engine/ (outside the sandbox's view).
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      # Avo.app/Contents/MacOS/avo-vmm: the VM engine (engine/hvf/vmm, Rust),
      # signed with the hypervisor entitlement.
      - name: Build avo-vmm
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          CARGO="${CARGO:-$HOME/.cargo/bin/cargo}"
          ENGINE="$SRCROOT/../engine/hvf"
          OUT="$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/avo-vmm"
          if [ ! -x "$CARGO" ]; then
            echo "warning: cargo not found; Avo.app is built without avo-vmm (install Rust: https://rustup.rs)"
            exit 0
          fi
          "$CARGO" build --release --quiet --manifest-path "$ENGINE/Cargo.toml" -p avo-vmm --target-dir "$DERIVED_FILE_DIR/cargo"
          # Nothing to do when neither the engine nor its entitlements changed:
          # Avo.app stays sealed.
          INSTALLED="$DERIVED_FILE_DIR/avo-vmm.installed"
          if [ -f "$OUT" ] && cmp -s "$DERIVED_FILE_DIR/cargo/release/avo-vmm" "$INSTALLED" \
             && [ ! "$ENGINE/hypervisor.entitlements" -nt "$INSTALLED" ]; then
            exit 0
          fi
          STAGED="$DERIVED_FILE_DIR/avo-vmm"
          cp "$DERIVED_FILE_DIR/cargo/release/avo-vmm" "$STAGED"
          codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" --options runtime \
            --entitlements "$ENGINE/hypervisor.entitlements" "$STAGED"
          # Replace, never overwrite: macOS kills a running VM whose signed
          # executable pages change underneath it.
          mv -f "$STAGED" "$OUT"
          cp "$DERIVED_FILE_DIR/cargo/release/avo-vmm" "$INSTALLED"
          # Xcode does not sign the app again when only this file changed:
          # seal the bundle over the new engine (keeping its entitlements),
          # or every Avo process fails code signature checks.
          if codesign --display "$TARGET_BUILD_DIR/$WRAPPER_NAME" >/dev/null 2>&1; then
            codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" \
              --preserve-metadata=identifier,entitlements,requirements,flags,runtime "$TARGET_BUILD_DIR/$WRAPPER_NAME"
          fi
      # Avo.app/Contents/Resources/gfxstream: the GPU renderer avo-vmm loads
      # (gfxstream, the Vulkan loader and MoltenVK, built from source by
      # scripts/build-gfxstream.sh into build/gfxstream), so the GPU needs no
      # Android Emulator.
      - name: Embed the GPU renderer
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          RENDERER="$SRCROOT/../build/gfxstream"
          OUT="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/gfxstream"
          if [ ! -f "$RENDERER/.stamp" ]; then
            echo "warning: no GPU renderer in build/gfxstream (run scripts/build-gfxstream.sh); Avo.app then needs the Android Emulator for the GPU"
            exit 0
          fi
          # Nothing to do when the renderer did not change: Avo.app stays sealed.
          if [ -f "$OUT/.stamp" ] && cmp -s "$RENDERER/.stamp" "$OUT/.stamp"; then
            exit 0
          fi
          rm -rf "$OUT.new"
          ditto "$RENDERER" "$OUT.new"
          find "$OUT.new" -name "*.dylib" -exec codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" {} \;
          # Replace, never overwrite: a running avo-vmm has the old libraries mapped.
          rm -rf "$OUT"
          mv "$OUT.new" "$OUT"
          if codesign --display "$TARGET_BUILD_DIR/$WRAPPER_NAME" >/dev/null 2>&1; then
            codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" \
              --preserve-metadata=identifier,entitlements,requirements,flags,runtime "$TARGET_BUILD_DIR/$WRAPPER_NAME"
          fi
      # Avo.app/Contents/Resources/bluetooth: Android's Bluetooth controller
      # avo-vmm starts (Root Canal, built from source by
      # scripts/build-bluetooth.sh into build/bluetooth), so Bluetooth needs no
      # Android Emulator.
      - name: Embed the Bluetooth controller
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          CONTROLLER="$SRCROOT/../build/bluetooth"
          OUT="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/bluetooth"
          if [ ! -f "$CONTROLLER/.stamp" ]; then
            echo "warning: no Bluetooth controller in build/bluetooth (run scripts/build-bluetooth.sh); Avo.app then needs the Android Emulator for Bluetooth"
            exit 0
          fi
          # Nothing to do when the controller did not change: Avo.app stays sealed.
          if [ -f "$OUT/.stamp" ] && cmp -s "$CONTROLLER/.stamp" "$OUT/.stamp"; then
            exit 0
          fi
          rm -rf "$OUT.new"
          ditto "$CONTROLLER" "$OUT.new"
          codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$OUT.new/rootcanal"
          # Replace, never overwrite: a running avo-vmm may have started it.
          rm -rf "$OUT"
          mv "$OUT.new" "$OUT"
          if codesign --display "$TARGET_BUILD_DIR/$WRAPPER_NAME" >/dev/null 2>&1; then
            codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" \
              --preserve-metadata=identifier,entitlements,requirements,flags,runtime "$TARGET_BUILD_DIR/$WRAPPER_NAME"
          fi

  AvoDaemon:
    type: application
    platform: macOS
    sources:
      - AvoDaemon
      # Same icon and menu bar template image as the Control Panel.
      - path: Avo/Assets.xcassets
      - path: Avo/AppIcon.icon
      # The menu bar's panel (MenuBarPanel.swift) wears the Library's haze:
      # its theme and typefaces. HazeTheme.swift must stay free of Avo-only types.
      - path: Avo/HazeTheme.swift
      - path: Avo/Fonts
    dependencies:
      - package: AvoKit
        product: AvoHostKit
        embed: false
      # Android widgets' panels (WidgetPanels), run in the daemon; Avo.app embeds the framework.
      - target: AvoWindowHost
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AVO_BUNDLE_ID_PREFIX).daemon
        PRODUCT_NAME: AvoDaemon
        INFOPLIST_FILE: AvoDaemon/Info.plist
        CODE_SIGN_ENTITLEMENTS: AvoDaemon/AvoDaemon.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_DEBUG_DYLIB: NO
        SKIP_INSTALL: YES
        # AvoHostKit.framework lives in Avo.app/Contents/Frameworks, five levels up from
        # Avo.app/Contents/Library/Helpers/AvoDaemon.app/Contents/MacOS.
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../../../../../Frameworks"

  AvoWindowHost:
    type: framework
    platform: macOS
    sources: [AvoWindowHost]
    dependencies:
      - package: AvoKit
        product: AvoHostKit
        embed: false
      - sdk: Metal.framework
      - sdk: MetalFX.framework
      - sdk: GameController.framework
      # Controller vibration (GamepadHub.pulse).
      - sdk: CoreHaptics.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AVO_BUNDLE_ID_PREFIX).WindowHost
        PRODUCT_NAME: AvoWindowHost
        INFOPLIST_FILE: AvoWindowHost/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        # Shims load this framework from Avo.app while running from
        # ~/Applications/Android Apps, so its dependencies are found next to
        # it (Avo.app/Contents/Frameworks), not next to the executable.
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @loader_path/../../.. @executable_path/../Frameworks"

  avoctl:
    type: tool
    platform: macOS
    sources: [avoctl]
    dependencies:
      - package: AvoKit
        product: AvoHostKit
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AVO_BUNDLE_ID_PREFIX).avoctl
        PRODUCT_NAME: avoctl
        SKIP_INSTALL: YES
        # Installed as Avo.app/Contents/MacOS/avoctl.
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"

  AvoShim:
    type: application
    platform: macOS
    sources: [AvoShim]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AVO_BUNDLE_ID_PREFIX).shim.template
        PRODUCT_NAME: AvoShim
        INFOPLIST_FILE: AvoShim/Info.plist
        ENABLE_DEBUG_DYLIB: NO
        SKIP_INSTALL: YES
        # Shims are re-signed ad hoc per app and must load AvoWindowHost.framework
        # from Avo.app, so the template does not use the hardened runtime.
        ENABLE_HARDENED_RUNTIME: NO

schemes:
  Avo:
    build:
      targets:
        Avo: all
    run:
      config: Debug
    archive:
      config: Release
