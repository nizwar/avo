# Avo's VM engine (docs/engine.md): Hypervisor.framework bindings, a safe
# wrapper, bring-up probes and avo-vmm.
[workspace]
resolver = "3"
members = ["hvf-sys", "hvf", "probe", "vmm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
publish = false

# A panic anywhere (a device thread, the render thread, a vCPU) ends the
# process instead of only unwinding its own thread and leaving the machine
# stuck. avo-vmm's panic hook ends it first, with exit status 101 (75 on the
# renderer's threads; cuttlefish::exit_on_panic), so the daemon never takes a
# bug for a GPU crash (SIGABRT). Tests build with the dev/test profile, which
# keeps unwinding, so `#[should_panic]` and catch_unwind work.
[profile.release]
panic = "abort"
